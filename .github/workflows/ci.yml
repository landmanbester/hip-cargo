name: CI

# Pull requests only. A push to main is the merge of a PR that already passed
# here, so re-running the suite after merge buys nothing (and the update-cabs
# bot commit only regenerates cabs). PRs into another branch get no run, to
# save CI minutes; opt in by naming a long-lived integration branch dev-*
# (each with its own PR into main), or for any branch on demand:
#   gh workflow run ci.yml --ref <branch>
on:
  pull_request:
    branches: [ main, 'dev-*' ]
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # setup-uv caches uv's cache directory (it sets UV_CACHE_DIR) on GitHub-hosted
      # runners by default, keyed on OS, arch, Python and uv.lock. An actions/cache
      # step on ~/.cache/uv would save nothing: uv no longer writes there.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Lint code
        run: uv run ruff check .

  test:
    # Job names are what branch protection requires: Tests (3.10), Tests (3.14),
    # Tests (3.14, arm64).
    name: Tests (${{ matrix.python-version }}${{ matrix.arch-label }})
    runs-on: ${{ matrix.os }}
    env:
      # Without this, uv obeys .python-version (3.11) and the matrix is cosmetic.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported Python only: code that passes both rarely
        # breaks in between. The oldest must match requires-python, because the
        # lightweight install (no `full` extra) has to work there.
        python-version: ["3.10", "3.14"]
        os: [ubuntu-latest]
        include:
          # One arm64 job, matching the arm64 image publish-container builds. It
          # catches a dependency without an aarch64 wheel before merge.
          - os: ubuntu-24.04-arm
            python-version: "3.14"
            arch-label: ", arm64"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group test

      - name: Run tests
        run: uv run pytest -v
