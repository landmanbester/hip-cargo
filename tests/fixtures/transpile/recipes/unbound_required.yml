_include:
  - (fakepkg.cabs)alpha.yml
  - (fakepkg.cabs)delta.yml

demo:
  name: demo
  inputs:
    base-dir:
      dtype: Directory
      required: true
  steps:
    first:
      cab: alpha
      params:
        output: '{recipe.base-dir}/a.zarr'
    second:
      cab: delta
      params:
        input-data: '{recipe.base-dir}/a.zarr'
        output: '{recipe.base-dir}/d.zarr'
